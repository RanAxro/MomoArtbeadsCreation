<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f3f1" />
    <link rel="icon" href="%sveltekit.assets%/logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/logo.webp" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      (() => {
        const theme = localStorage.getItem('momo-artbeads.theme') === 'dark' ? 'dark' : 'light';
        const locale = localStorage.getItem('momo-artbeads.locale') === 'en-US' ? 'en-US' : 'zh-CN';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = locale;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
